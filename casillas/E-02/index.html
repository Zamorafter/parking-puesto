<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ubicación de Estacionamiento E-02</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0a192f;
            --navy-card: rgba(17, 34, 64, 0.85);
            --navy-light: #172a45;
            --yellow-primary: #f5c518;
            --yellow-glow: rgba(245, 197, 24, 0.15);
            --text-light: #f8f9fa;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--navy-deep);
            background-image: radial-gradient(circle at center, var(--navy-light) 0%, var(--navy-deep) 100%);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(245, 197, 24, 0.08) 0%, rgba(10, 25, 47, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(23, 42, 69, 0.6) 0%, rgba(10, 25, 47, 0) 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 2;
        }

        header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-badge {
            background-image: url('../../vinil.jpg');
            background-size: cover;
            background-position: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(245, 197, 24, 0.3);
            flex: 0 0 auto;
        }

        .brand-name {
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-light);
        }

        .brand-tagline {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .card {
            background: var(--navy-card);
            border: 1px solid rgba(245, 197, 24, 0.15);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px var(--yellow-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: zoomIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            transition: 0.75s;
        }

        .card:hover::before {
            left: 150%;
            transition: 0.75s;
        }

        .info-text {
            font-size: 1.35rem;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 0;
            font-weight: 600;
        }

        .highlight-text {
            color: var(--yellow-primary);
            font-weight: 800;
            display: inline-block;
            text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
        }

        .zone {
            font-size: 1.8rem;
            margin: 0.25rem 0;
        }

        .spot {
            font-size: 2.2rem;
        }

        .logo-container {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-clean {
            max-width: 170px;
            height: auto;
            animation: logoFloat 4s ease-in-out infinite;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="app-container">
        <header>
            <div class="logo-badge" aria-hidden="true"></div>
            <div>
                <div class="brand-name">Parking Tolón</div>
                <div class="brand-tagline">Ubicación de estacionamiento</div>
            </div>
        </header>

        <main class="card">
            <p class="info-text">
                Usted está estacionado en el <br>
                <span class="highlight-text zone">Sótano 1, Lado Norte</span> <br>
                Columna <span class="highlight-text spot">E-02</span>
            </p>

            <div class="logo-container">
                <img src="../../logo.png" alt="Parking Tolón" class="logo-clean">
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SmartPark. Todos los derechos reservados.</p>
        </footer>
    </div>
</body>
</html>
